<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f342d" />

    <title>吉他保养档案</title>
    <style>
    /* Ensure native hidden elements stay hidden even when component classes define display. */
    [hidden] { display: none !important; }
:root {
  --bg: #f4f2ed;
  --surface: #ffffff;
  --surface-2: #f8f7f3;
  --text: #1e2824;
  --muted: #69756f;
  --border: #e4e2dc;
  --primary: #1f342d;
  --primary-2: #2f4b40;
  --accent: #b68855;
  --danger: #a3473f;
  --warning: #a66d2a;
  --success: #39735b;
  --shadow: 0 16px 50px rgba(31, 52, 45, .08);
  --radius: 18px;
  --radius-sm: 12px;
  --sidebar: 250px;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
svg { width: 1.15rem; height: 1.15rem; }

.skip-link { position: fixed; left: 16px; top: -60px; z-index: 1000; padding: 10px 14px; background: var(--primary); color: white; border-radius: 8px; }
.skip-link:focus { top: 16px; }

.hidden { display: none !important; }

/* Auth */
.auth-layout { min-height: 100vh; display: grid; grid-template-columns: minmax(380px, 520px) 1fr; background: var(--surface); }
.auth-panel { padding: clamp(32px, 6vw, 80px); display: flex; flex-direction: column; justify-content: center; }
.auth-brand { display: flex; gap: 16px; align-items: center; }
.brand-mark { width: 42px; height: 42px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--primary); color: #e6d2b5; flex: 0 0 auto; }
.brand-mark svg { width: 27px; height: 27px; }
.brand-mark--large { width: 58px; height: 58px; border-radius: 16px; }
.brand-mark--large svg { width: 36px; height: 36px; }
.eyebrow { margin: 0 0 5px; font-size: 11px; letter-spacing: .18em; color: var(--accent); font-weight: 700; }
.auth-brand h1 { margin: 0; font-size: 34px; letter-spacing: -.035em; }
.auth-intro { margin: 30px 0 22px; max-width: 410px; font-size: 16px; line-height: 1.8; color: var(--muted); }
.auth-help { color: var(--muted); font-size: 13px; line-height: 1.7; margin-top: 18px; }
.auth-aside { position: relative; min-height: 100vh; overflow: hidden; display: flex; align-items: flex-end; padding: clamp(32px, 6vw, 84px); background: radial-gradient(circle at 30% 25%, #526f63 0, transparent 32%), linear-gradient(135deg, #15271f, #2d463b 55%, #15271f); color: #f6f2e9; }
.auth-aside__texture { position: absolute; inset: 0; opacity: .24; background-image: repeating-linear-gradient(8deg, transparent 0 18px, rgba(231, 207, 170, .14) 19px, transparent 20px); transform: scale(1.2); }
.auth-aside__copy { position: relative; z-index: 1; max-width: 540px; }
.auth-aside__copy p { margin: 0 0 10px; font-size: clamp(30px, 4vw, 56px); line-height: 1.08; letter-spacing: -.04em; max-width: 620px; }
.auth-aside__copy small { letter-spacing: .24em; opacity: .66; }
.auth-aside__line { display: block; width: 46px; height: 2px; background: #c39a6b; margin-bottom: 20px; }
.form-stack { display: grid; gap: 18px; max-width: 440px; }
.field-group { display: grid; gap: 8px; }
.field-group label { font-size: 13px; font-weight: 650; }
.field-group input, .field-group select, .field-group textarea, .search-input { width: 100%; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 12px; padding: 12px 14px; outline: none; transition: border-color .15s, box-shadow .15s; }
.field-group textarea { min-height: 98px; resize: vertical; }
.field-group input:focus, .field-group select:focus, .field-group textarea:focus, .search-input:focus { border-color: #839c91; box-shadow: 0 0 0 4px rgba(84, 122, 105, .10); }
.password-field { position: relative; }
.password-field input { padding-right: 46px; }
.password-toggle { position: absolute; right: 7px; top: 7px; }
.form-message { font-size: 13px; margin: 0; padding: 10px 12px; border-radius: 10px; }
.form-message--error { background: #fbefed; color: var(--danger); }

/* App shell */
.app-shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: var(--primary); color: #edf2ee; padding: 22px 16px; z-index: 30; }
.sidebar__brand { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 22px; border-bottom: 1px solid rgba(255,255,255,.10); }
.brand { display: flex; gap: 12px; align-items: center; min-width: 0; }
.brand__text { display: grid; gap: 3px; min-width: 0; }
.brand__text strong { font-size: 15px; white-space: nowrap; }
.brand__text small { font-size: 11px; color: rgba(255,255,255,.60); white-space: nowrap; }
.sidebar__nav { padding-top: 22px; flex: 1; }
.nav-label { padding: 0 10px; margin: 0 0 8px; color: rgba(255,255,255,.40); font-size: 11px; letter-spacing: .1em; }
.nav-label--spaced { margin-top: 24px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; color: rgba(255,255,255,.72); border-radius: 12px; margin-bottom: 4px; transition: background .15s, color .15s; font-size: 14px; }
.nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav-item.is-active { color: #173227; background: #f4f2ed; font-weight: 700; }
.nav-icon { width: 22px; text-align: center; opacity: .8; }
.sidebar__footer { display: grid; gap: 12px; }
.connection-status { display: flex; gap: 8px; align-items: center; min-height: 30px; font-size: 11px; color: rgba(255,255,255,.62); }
.connection-status__dot, .mobile-header__status { width: 8px; height: 8px; border-radius: 999px; background: #9dafa6; box-shadow: 0 0 0 4px rgba(157,175,166,.12); }
.connection-status.is-online .connection-status__dot, .mobile-header__status.is-online { background: #8ac3a5; }
.connection-status.is-offline .connection-status__dot, .mobile-header__status.is-offline { background: #d27d75; }
.account-card { display: flex; gap: 10px; align-items: center; border-top: 1px solid rgba(255,255,255,.1); padding-top: 12px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; background: #eadbc5; color: var(--primary); flex: 0 0 auto; }
.account-card__info { display: grid; min-width: 0; flex: 1; }
.account-card__info strong { font-size: 12px; }
.account-card__info span { font-size: 10px; color: rgba(255,255,255,.48); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar__close, .mobile-header { display: none; }

.app-content { min-width: 0; }
.main-content { padding: 28px clamp(20px, 4vw, 56px) 60px; max-width: 1600px; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; margin-bottom: 28px; }
.page-header__eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); margin: 0 0 7px; font-weight: 750; }
.page-header h2 { font-size: clamp(28px, 3vw, 38px); line-height: 1.1; margin: 0; letter-spacing: -.04em; }
.page-header p { color: var(--muted); margin: 8px 0 0; line-height: 1.6; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.button { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 11px; padding: 10px 14px; font-weight: 650; transition: transform .12s, background .12s, border-color .12s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.button:hover { border-color: #bcc5be; background: #fbfaf7; }
.button:active { transform: translateY(1px); }
.button--primary { color: white; background: var(--primary); border-color: var(--primary); }
.button--primary:hover { background: var(--primary-2); border-color: var(--primary-2); }
.button--danger { color: #fff; background: var(--danger); border-color: var(--danger); }
.button--ghost { background: transparent; }
.button--small { padding: 7px 10px; font-size: 12px; border-radius: 9px; }
.button--large { padding: 13px 16px; }
.button--block { width: 100%; }
.button[disabled] { opacity: .55; cursor: not-allowed; }
.icon-button { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; color: inherit; border-radius: 9px; }
.icon-button:hover { background: rgba(255,255,255,.08); }

/* Dashboard */
.stats-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; min-height: 108px; box-shadow: 0 7px 25px rgba(31,52,45,.03); }
.stat-card__label { color: var(--muted); font-size: 12px; }
.stat-card__value { margin-top: 8px; font-size: 28px; font-weight: 750; letter-spacing: -.045em; }
.stat-card__hint { margin-top: 5px; font-size: 11px; color: var(--muted); }
.stat-card.is-alert .stat-card__value { color: var(--danger); }
.stat-card.is-warn .stat-card__value { color: var(--warning); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: 0 7px 25px rgba(31,52,45,.03); }
.panel__header { padding: 17px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.panel__header h3 { margin: 0; font-size: 16px; }
.panel__header span { color: var(--muted); font-size: 12px; }
.panel__body { padding: 4px 0; }

.list-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; border-bottom: 1px solid #efede8; }
.list-row:last-child { border-bottom: 0; }
.list-row__main { min-width: 0; }
.list-row__title { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; font-weight: 700; font-size: 13px; }
.list-row__sub { margin-top: 4px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.list-row__meta { text-align: right; color: var(--muted); font-size: 11px; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 999px; font-size: 10px; font-weight: 750; white-space: nowrap; }
.badge--green { background: #e9f4ef; color: #2d684f; }
.badge--amber { background: #faf0df; color: #8f6026; }
.badge--red { background: #faecea; color: #923e38; }
.badge--gray { background: #eeece7; color: #666b66; }
.badge--dark { background: #e3e9e6; color: #355148; }

.empty-state { padding: 42px 18px; text-align: center; color: var(--muted); }
.empty-state strong { display: block; color: var(--text); margin-bottom: 6px; }

/* Tables / pages */
.toolbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.search-wrap { flex: 1 1 340px; position: relative; }
.search-input { padding-left: 38px; }
.search-wrap::before { content: "⌕"; position: absolute; left: 14px; top: 8px; font-size: 20px; color: var(--muted); z-index: 1; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-chip { border: 1px solid var(--border); background: var(--surface); color: var(--muted); padding: 8px 11px; border-radius: 999px; font-size: 12px; }
.filter-chip.is-active { color: var(--text); background: #e8eee9; border-color: #cbd9d0; font-weight: 700; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 780px; }
th, td { text-align: left; padding: 13px 16px; border-bottom: 1px solid #efede8; white-space: nowrap; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: #fbfaf7; }
td { font-size: 13px; }
.table-main { font-weight: 700; }
.table-sub { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); }
.row-actions { display: flex; gap: 4px; justify-content: flex-end; }

.detail-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(320px, .85fr); gap: 18px; align-items: start; }
.detail-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.detail-card__body { padding: 20px; }
.detail-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
.detail-title { margin: 0; font-size: 30px; letter-spacing: -.04em; }
.detail-sub { margin: 7px 0 0; color: var(--muted); }
.kv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 20px; }
.kv { padding: 12px 13px; background: var(--surface-2); border-radius: 12px; }
.kv dt { color: var(--muted); font-size: 11px; }
.kv dd { margin: 4px 0 0; font-size: 14px; font-weight: 650; word-break: break-word; }
.maintenance-list { display: grid; gap: 0; }
.maintenance-item { position: relative; padding: 17px 20px 17px 38px; border-bottom: 1px solid #efede8; }
.maintenance-item:last-child { border-bottom: 0; }
.maintenance-item::before { content: ""; position: absolute; left: 18px; top: 22px; width: 8px; height: 8px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 5px #f5eee5; }
.maintenance-item::after { content: ""; position: absolute; left: 21px; top: 31px; bottom: -1px; width: 2px; background: #ece8df; }
.maintenance-item:last-child::after { display: none; }
.maintenance-item__top { display: flex; gap: 9px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.maintenance-item__date { font-size: 13px; font-weight: 750; }
.maintenance-item__body { margin-top: 8px; white-space: pre-wrap; line-height: 1.65; color: #46524d; font-size: 13px; }
.maintenance-item__meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 9px; color: var(--muted); font-size: 11px; }

.notice { border: 1px solid #e8d8bf; background: #fcf7ef; color: #76552d; padding: 12px 14px; border-radius: 12px; line-height: 1.6; font-size: 12px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 15px; }
.form-grid .full { grid-column: 1 / -1; }
.modal-container { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(20,26,23,.5); backdrop-filter: blur(2px); pointer-events: auto; }
.modal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(680px, calc(100vw - 24px)); max-height: min(88vh, 900px); overflow: auto; background: var(--surface); border-radius: 20px; box-shadow: 0 30px 100px rgba(0,0,0,.25); pointer-events: auto; }
.modal--small { width: min(480px, calc(100vw - 24px)); }
.modal__header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.modal__header h3 { margin: 0; font-size: 18px; }
.modal__body { padding: 20px; }
.modal__footer { padding: 14px 20px 20px; display: flex; justify-content: flex-end; gap: 8px; }

.setting-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; }
.setting-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.setting-card h3 { margin: 0 0 8px; font-size: 16px; }
.setting-card p { color: var(--muted); font-size: 12px; line-height: 1.65; margin: 0 0 14px; }
.setting-card__actions { display: flex; flex-wrap: wrap; gap: 8px; }

.qr-box { text-align: center; padding: 10px 0 4px; }
.qr-box img { width: min(320px, 80vw); height: auto; image-rendering: crisp-edges; background: white; padding: 12px; border: 1px solid var(--border); border-radius: 12px; }
.qr-url { font-size: 11px; color: var(--muted); word-break: break-all; margin-top: 8px; }

.app-loading { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(244,242,237,.68); backdrop-filter: blur(3px); }
.app-loading__card { display: flex; gap: 10px; align-items: center; padding: 14px 16px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); font-size: 13px; }
.loading-spinner, .button-spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #ccd5d0; border-top-color: var(--primary); animation: spin .75s linear infinite; display: inline-block; }
.button-spinner { display: none; width: 15px; height: 15px; border-color: rgba(255,255,255,.35); border-top-color: white; }
.is-loading .button-spinner { display: inline-block; }
.is-loading .button-text { opacity: .7; }
@keyframes spin { to { transform: rotate(360deg); } }

.toast-container { position: fixed; top: 16px; right: 16px; z-index: 120; display: grid; gap: 8px; width: min(370px, calc(100vw - 32px)); }
.toast { background: var(--primary); color: white; border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); font-size: 12px; animation: toast-in .18s ease-out; }
.toast--error { background: #8f3f39; }
.toast--success { background: #2e6850; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

.page-state { min-height: 55vh; display: grid; place-items: center; text-align: center; color: var(--muted); }
.page-state p { margin: 8px 0 0; font-size: 13px; }
.error-box { background: #fbefed; color: var(--danger); border: 1px solid #f0d2cf; padding: 14px; border-radius: 12px; }

@media (max-width: 1200px) { .stats-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } .detail-grid { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  .auth-layout { grid-template-columns: 1fr; }
  .auth-aside { display: none; }
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; width: min(280px, 85vw); transform: translateX(-105%); transition: transform .2s; box-shadow: 20px 0 50px rgba(0,0,0,.15); }
  .sidebar.is-open { transform: translateX(0); }
  .sidebar__close { display: inline-flex; }
  .sidebar-backdrop { position: fixed; inset: 0; background: rgba(14,21,18,.45); z-index: 25; }
  .mobile-header { display: flex; height: 60px; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--border); background: rgba(244,242,237,.92); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 20; }
  .mobile-header__brand { font-weight: 750; font-size: 14px; }
  .mobile-header__menu { color: var(--primary); }
  .mobile-header__status { box-shadow: none; }
  .main-content { padding-top: 22px; }
  .two-col, .setting-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .auth-panel { padding: 28px 20px; }
  .auth-brand h1 { font-size: 28px; }
  .page-header { align-items: flex-start; flex-direction: column; }
  .actions { justify-content: flex-start; }
  .stats-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .stat-card { min-height: 100px; }
  .stat-card__value { font-size: 24px; }
  .form-grid, .kv-grid { grid-template-columns: 1fr; }
  .form-grid .full { grid-column: auto; }
  .detail-head { flex-direction: column; }
  .main-content { padding-left: 14px; padding-right: 14px; }
  .modal__body { padding: 16px; }
  .modal__footer { padding: 12px 16px 16px; }
}

@media print {
  body { background: #fff; }
  .sidebar, .mobile-header, .actions, .toast-container, .modal-container, .connection-status, .account-card { display: none !important; }
  .app-shell { display: block; }
  .main-content { padding: 0; max-width: none; }
  .panel, .detail-card { box-shadow: none; }
}


body { overflow-x: hidden; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

const state = {

const dateFormatter = new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit" });
const moneyFormatter = new Intl.NumberFormat("zh-CN", { style: "currency", currency: "CNY", maximumFractionDigits: 2 });

function esc(value = "") {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function todayISO() {
  const now = new Date();
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}

function formatDate(value) {
  if (!value) return "未设置";
  const d = new Date(`${value}T00:00:00`);
  return Number.isNaN(d.getTime()) ? "无效日期" : dateFormatter.format(d);
}

function diffDays(date) {
  if (!date) return null;
  const a = new Date(`${todayISO()}T00:00:00`);
  const b = new Date(`${date}T00:00:00`);
  return Math.round((b - a) / 86400000);
}

function maintenanceStatus(nextDate) {
  if (!nextDate) return { key: "unset", label: "未设置", className: "badge--gray" };
  const days = diffDays(nextDate);
  if (days < 0) return { key: "overdue", label: "已逾期", className: "badge--red" };
  if (days <= 30) return { key: "upcoming", label: "即将保养", className: "badge--amber" };
  return { key: "normal", label: "正常", className: "badge--green" };
}

function currentStatusBadge(status) {
  const map = {
    正常: "badge--green",
    待保养: "badge--amber",
    维修中: "badge--red",
    闲置: "badge--gray",
    已售: "badge--dark",
  };
  return `<span class="badge ${map[status] || "badge--gray"}">${esc(status || "未设置")}</span>`;
}

function typeBadge(type) {
  return `<span class="badge ${type === "student" ? "badge--dark" : "badge--gray"}">${type === "student" ? "学员" : "访客"}</span>`;
}

function getPeople() {
  return Object.entries(state.data.people || {})
    .map(([id, p]) => ({ id, ...p }))
    .sort((a, b) => (a.name || "").localeCompare(b.name || "", "zh-CN"));
}

function getGuitars() {
  return Object.entries(state.data.guitars || {})
    .map(([id, g]) => ({ id, ...g }))
    .sort((a, b) => (a.brand || "").localeCompare(b.brand || ""));
}

function getRecordsForGuitar(guitarId) {
  return Object.entries(state.data.maintenanceRecords || {})
    .map(([id, r]) => ({ id, ...r }))
    .filter((r) => r.guitarId === guitarId)
    .sort((a, b) => String(b.maintenanceDate || "").localeCompare(String(a.maintenanceDate || "")));
}

function getLatestMaintenance(guitarId) {
  return getRecordsForGuitar(guitarId)[0] || null;
}

function getPerson(personId) {
  return state.data.people?.[personId] ? { id: personId, ...state.data.people[personId] } : null;
}

function getGuitar(guitarId) {
  return state.data.guitars?.[guitarId] ? { id: guitarId, ...state.data.guitars[guitarId] } : null;
}

function personGuitars(personId) {
  return getGuitars().filter((g) => g.personId === personId);
}

function setConnection(online) {
  state.connection = online;
  const status = $("#connection-status");
  const dot = $("#mobile-connection-dot");
  if (status) {
    status.className = `connection-status ${online ? "is-online" : "is-offline"}`;
    $(".connection-status__text", status).textContent = online ? "数据服务已连接" : "网络连接中断";
  }
  if (dot) dot.className = `mobile-header__status ${online ? "is-online" : "is-offline"}`;
}

function toast(message, type = "") {
  const container = $("#toast-container");
  if (!container) return;
  const el = document.createElement("div");
  el.className = `toast ${type ? `toast--${type}` : ""}`;
  el.textContent = message;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function setAppLoading(show, text = "正在处理…") {
  const loading = $("#app-loading");
  if (!loading) return;
  loading.hidden = !show;
  $("span:last-child", loading).textContent = text;
}

function withTimeout(promise, ms = 12000, message = "Firebase 请求超时。请检查网络、Firebase 配置和数据库规则。") {
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = window.setTimeout(() => reject(new Error(message)), ms);
  });
  return Promise.race([promise, timeout]).finally(() => window.clearTimeout(timer));
}

function ensureDatabaseConnected() {
  if (!state.connection) {
    throw new Error("当前还没有连接到 Firebase 数据库。请确认网络正常，并稍等片刻再试。");
  }
}

function route() {
  const raw = location.hash.replace(/^#\/?/, "");
  const path = raw.split("?")[0];
  const parts = path.split("/").filter(Boolean);
  return { name: parts[0] || "dashboard", id: parts[1] || null };
}

function showModal({ title, body, footer = "", small = false, onOpen }) {

function pageShell(title, subtitle, actions, content, eyebrow = "GUITAR CARE LOG") {
  return `

      <div><p class="page-header__eyebrow">${esc(eyebrow)}</p><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div>

function renderDashboard() {
  const people = getPeople();
  const guitars = getGuitars();
  const activePeople = people.filter((p) => p.active !== false);
  const students = activePeople.filter((p) => p.type === "student").length;
  const visitors = activePeople.filter((p) => p.type === "visitor").length;
  const records = Object.values(state.data.maintenanceRecords || {});
  const month = todayISO().slice(0, 7);
  const monthCount = records.filter((r) => String(r.maintenanceDate || "").startsWith(month)).length;

  const guitarsWithDue = guitars.map((g) => ({
    ...g,
    person: getPerson(g.personId),
    latest: getLatestMaintenance(g.id),
  })).filter((x) => x.latest?.nextMaintenanceDate);

  const upcoming = guitarsWithDue.filter((x) => {
    const days = diffDays(x.latest.nextMaintenanceDate);
    return days >= 0 && days <= 30;
  }).sort((a, b) => a.latest.nextMaintenanceDate.localeCompare(b.latest.nextMaintenanceDate));

  const overdue = guitarsWithDue.filter((x) => diffDays(x.latest.nextMaintenanceDate) < 0)
    .sort((a, b) => a.latest.nextMaintenanceDate.localeCompare(b.latest.nextMaintenanceDate));

  const upcomingRows = upcoming.length ? upcoming.map((x) => {
    const days = diffDays(x.latest.nextMaintenanceDate);
    return `<a class="list-row" href="#/guitar/${x.id}"><div class="list-row__main"><div class="list-row__title">${esc(x.person?.name || "未归属")} ${typeBadge(x.person?.type)}</div><div class="list-row__sub">${esc(x.brand)} ${esc(x.model)} · 下次保养 ${formatDate(x.latest.nextMaintenanceDate)}</div></div><div class="list-row__meta">${days === 0 ? "今天" : `${days} 天后`}<br><span class="badge badge--amber">即将保养</span></div></a>`;
  }).join("") : `<div class="empty-state"><strong>未来 30 天没有到期的吉他</strong>目前不需要安排保养。</div>`;

  const overdueRows = overdue.length ? overdue.map((x) => {
    const days = Math.abs(diffDays(x.latest.nextMaintenanceDate));
    return `<a class="list-row" href="#/guitar/${x.id}"><div class="list-row__main"><div class="list-row__title">${esc(x.person?.name || "未归属")} ${typeBadge(x.person?.type)}</div><div class="list-row__sub">${esc(x.brand)} ${esc(x.model)} · 原定 ${formatDate(x.latest.nextMaintenanceDate)}</div></div><div class="list-row__meta">逾期 ${days} 天<br><span class="badge badge--red">已逾期</span></div></a>`;
  }).join("") : `<div class="empty-state"><strong>没有逾期记录</strong>目前所有已设置日期的吉他都在计划内。</div>`;

  return pageShell(
    "首页",
    "把今天该处理的吉他放在最前面。",
    `<a class="button button--primary" href="#/people?action=new">＋ 新增人员</a><a class="button" href="#/guitars?action=new">＋ 新增吉他</a>`,
    `<section class="stats-grid">
      <article class="stat-card"><div class="stat-card__label">人员总数</div><div class="stat-card__value">${activePeople.length}</div><div class="stat-card__hint">当前启用档案</div></article>
      <article class="stat-card"><div class="stat-card__label">学员</div><div class="stat-card__value">${students}</div><div class="stat-card__hint">当前启用</div></article>
      <article class="stat-card"><div class="stat-card__label">访客</div><div class="stat-card__value">${visitors}</div><div class="stat-card__hint">当前启用</div></article>
      <article class="stat-card"><div class="stat-card__label">吉他总数</div><div class="stat-card__value">${guitars.length}</div><div class="stat-card__hint">包含停用档案</div></article>
      <article class="stat-card is-warn"><div class="stat-card__label">即将保养</div><div class="stat-card__value">${upcoming.length}</div><div class="stat-card__hint">未来 30 天</div></article>
      <article class="stat-card is-alert"><div class="stat-card__label">已逾期</div><div class="stat-card__value">${overdue.length}</div><div class="stat-card__hint">需要尽快处理</div></article>
    </section>
    <div class="two-col">
      <section class="panel"><header class="panel__header"><div><h3>即将保养</h3><span>未来 30 天</span></div><a class="button button--small" href="#/guitars?filter=upcoming">查看全部</a></header><div class="panel__body">${upcomingRows}</div></section>
      <section class="panel"><header class="panel__header"><div><h3>已逾期</h3><span>需要尽快处理</span></div><a class="button button--small" href="#/guitars?filter=overdue">查看全部</a></header><div class="panel__body">${overdueRows}</div></section>
    </div>
    <section class="panel" style="margin-top:18px"><header class="panel__header"><div><h3>本月保养</h3><span>${month} 共 ${monthCount} 次</span></div><a class="button button--small" href="#/guitars">查看吉他列表</a></header></section>`
  );
}

function renderPeople() {
  const urlParams = new URLSearchParams(location.hash.split("?")[1] || "");
  const action = urlParams.get("action");
  const q = state.personSearch.trim().toLowerCase();
  let people = getPeople().filter((p) => state.personFilter === "all" ? true : state.personFilter === "inactive" ? p.active === false : p.type === state.personFilter && p.active !== false);
  people = people.filter((p) => {
    if (!q) return true;
    const hay = [p.name, p.phone, p.memberNo, ...personGuitars(p.id).flatMap((g) => [g.brand, g.model, g.serialNumber])].join(" ").toLowerCase();
    return hay.includes(q);
  });

function renderGuitars() {
  const params = new URLSearchParams(location.hash.split("?")[1] || "");

  if (queryFilter === "upcoming" || queryFilter === "overdue") state.guitarStatusFilter = queryFilter;
  const q = state.guitarSearch.trim().toLowerCase();
  let guitars = getGuitars().map((g) => ({ ...g, person: getPerson(g.personId), latest: getLatestMaintenance(g.id) }));
  guitars = guitars.filter((g) => {
    if (!q) return true;
    const hay = [g.person?.name, g.person?.phone, g.person?.memberNo, g.brand, g.model, g.serialNumber].join(" ").toLowerCase();
    return hay.includes(q);
  });
  guitars = guitars.filter((g) => {
    if (state.guitarStatusFilter === "upcoming") return maintenanceStatus(g.latest?.nextMaintenanceDate).key === "upcoming";

  const rows = guitars.length ? guitars.map((g) => {

async function nextSequence(key) {
  const sequenceRef = ref(db, `meta/counters/${key}`);
  ensureDatabaseConnected();
  const result = await withTimeout(runTransaction(sequenceRef, (current) => {
    if (current != null) return Number(current || 0) + 1;
    const source = key === "people" ? state.data.people : key === "guitars" ? state.data.guitars : state.data.maintenanceRecords;
    const prefix = key === "people" ? "M" : key === "guitars" ? "G" : "R";
    let max = 0;
    Object.values(source || {}).forEach((item) => {
      const candidate = String(key === "people" ? item.memberNo || "" : item.displayNo || "");
      const match = candidate.match(new RegExp(`^${prefix}(\\d+)$`, "i"));
      if (match) max = Math.max(max, Number(match[1]));
    });
    return max + 1;
  }), 12000, "编号生成超时。请确认 Firebase Realtime Database 已连接且规则允许当前账号写入。");
  return Number(result.snapshot.val() || 1);
}

async function savePerson(form, personId = null) {
  const formData = new FormData(form);
  const now = Date.now();
  const data = {
    name: String(formData.get("name") || "").trim(),
    type: String(formData.get("type") || "student"),
    phone: String(formData.get("phone") || "").trim(),
    note: String(formData.get("note") || "").trim(),
    active: formData.get("active") === "on",
    updatedAt: now,
  };
  if (!data.name) throw new Error("请填写姓名。");
  ensureDatabaseConnected();

  if (personId) {
    await withTimeout(update(ref(db, `people/${personId}`), data));
    return personId;
  }
  const seq = await nextSequence("people");
  data.memberNo = `M${String(seq).padStart(3, "0")}`;
  data.createdAt = now;
  data.createdDate = todayISO();
  data.active = true;
  const newRef = push(ref(db, "people"));
  data.id = newRef.key;
  await withTimeout(set(newRef, data));
  return newRef.key;
}

function personOptions(selected = "") {

function downloadBlob(filename, content, type = "application/json") {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function exportJSON() {
  const payload = {
    version: 1,
    exportedAt: new Date().toISOString(),
    projectId: firebaseConfig.projectId,
    data: {
      people: state.data.people || {},
      guitars: state.data.guitars || {},
      maintenanceRecords: state.data.maintenanceRecords || {},
      meta: state.data.meta || {},
    },
  };
  downloadBlob(`guitar-maintenance-backup-${todayISO()}.json`, JSON.stringify(payload, null, 2));

function exportCSV() {
  const header = ["人员编号","人员","类型","手机号","品牌","型号","序列号","使用状态","上次保养","下次保养","保养状态"];
  const rows = getGuitars().map((g) => {
    const p = getPerson(g.personId); const latest = getLatestMaintenance(g.id); const m = maintenanceStatus(latest?.nextMaintenanceDate);
    return [p?.memberNo || "", p?.name || "", p?.type === "student" ? "学员" : p ? "访客" : "", p?.phone || "", g.brand || "", g.model || "", g.serialNumber || "", g.status || "", latest?.maintenanceDate || "", latest?.nextMaintenanceDate || "", m.label];
  });
  const csv = [header, ...rows].map((row) => row.map((v) => `"${String(v).replaceAll('"', '""')}"`).join(",")).join("\n");
  downloadBlob(`guitar-maintenance-${todayISO()}.csv`, "\uFEFF" + csv, "text/csv;charset=utf-8");
  toast("CSV 已导出。", "success");
}

async function importJSON(file) {
  const text = await file.text();
  let payload;
  try { payload = JSON.parse(text); } catch { throw new Error("JSON 文件格式无法解析。"); }
  const data = payload.data || payload;
  if (!data || typeof data !== "object" || typeof data.people !== "object" || typeof data.guitars !== "object" || typeof data.maintenanceRecords !== "object") throw new Error("这不是本系统导出的有效备份文件。");
  const okay = await askConfirm("确认导入数据", "导入会覆盖当前人员、吉他和保养记录。请确认你已经备份了当前数据。", "继续导入");
  if (!okay) return;
  setAppLoading(true, "正在导入数据…");
  try {
    ensureDatabaseConnected();
    await withTimeout(set(rootRef, { people: data.people || {}, guitars: data.guitars || {}, maintenanceRecords: data.maintenanceRecords || {}, meta: data.meta || {} }), 12000, "导入数据超时，请检查 Firebase 连接。");
    toast("数据已恢复。", "success");
  } finally { setAppLoading(false); }
}

function askConfirm(title, message, confirmText = "确认") {
  return new Promise((resolve) => {
    showModal({ title, small: true, body: `<p style="margin:0;color:var(--muted);line-height:1.7">${esc(message)}</p>`, footer: `<button class="button" data-confirm-result="false">取消</button><button class="button button--danger" data-confirm-result="true">${esc(confirmText)}</button>`, onOpen(container) {
      $$('[data-confirm-result]', container).forEach((el) => el.addEventListener("click", () => { const result = el.dataset.confirmResult === "true"; closeModal(); resolve(result); }));
    }});
  });
}

  setAppLoading(true, "正在删除…");
  try {
    const updates = {};
    updates[`people/${personId}`] = null;

      for (const r of getRecordsForGuitar(guitar.id)) updates[`maintenanceRecords/${r.id}`] = null;

function normalizeAuthError(error) {
  const map = {
    "auth/invalid-credential": "邮箱或密码不正确。",

    "auth/user-disabled": "这个账号已被禁用。",

    "auth/invalid-api-key": "Firebase 配置中的 API Key 无效。",

function bindStaticEvents() {
  $("#login-form")?.addEventListener("submit", async (event) => {

    const email = form.email.value.trim();
    const password = form.password.value;
    const errorEl = $("#login-error");
    const submit = $("#login-submit");
    errorEl.hidden = true;
    submit.classList.add("is-loading");
    submit.disabled = true;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (error) {
      errorEl.textContent = normalizeAuthError(error);
      errorEl.hidden = false;
    } finally {
      submit.classList.remove("is-loading");
      submit.disabled = false;
    }
  });

  $("#toggle-password")?.addEventListener("click", () => {
    const input = $("#login-password");
    const button = $("#toggle-password");
    const visible = input.type === "text";

    button.setAttribute("aria-label", visible ? "显示密码" : "隐藏密码");

    const action = button.dataset.action;

      if (action === "new-person") openPersonModal();
      if (action === "edit-person") openPersonModal(button.dataset.id);
      if (action === "new-guitar") openGuitarModal(null, button.dataset.personId || "");
      if (action === "edit-guitar") openGuitarModal(button.dataset.id);
      if (action === "new-maintenance") openMaintenanceModal(button.dataset.guitarId);
      if (action === "edit-maintenance") {
        const r = state.data.maintenanceRecords?.[button.dataset.id];
        if (r) openMaintenanceModal(r.guitarId, button.dataset.id);
      }
      if (action === "delete-maintenance") await deleteMaintenance(button.dataset.id);
      if (action === "delete-guitar") await deleteGuitar(button.dataset.id);
      if (action === "person-filter") { state.personFilter = button.dataset.filter; renderRoute(); }
      if (action === "guitar-filter") { state.guitarStatusFilter = button.dataset.filter; renderRoute(); }
      if (action === "export-json") exportJSON();
      if (action === "export-csv") exportCSV();
      if (action === "clear-all") {
        const one = await askConfirm("清空全部数据", "这会删除所有人员、吉他和保养记录，无法通过网页撤销。建议先导出 JSON。", "下一步");
        if (!one) return;
        const two = await askConfirm("再次确认", "你确定要彻底清空这个 Firebase 数据库吗？", "彻底清空");
        if (!two) return;
        setAppLoading(true, "正在清空数据…");
        try { await set(rootRef, {}); toast("全部数据已清空。", "success"); } finally { setAppLoading(false); }
      }
      if (action === "seed-demo") await seedDemo();
      if (action === "qr-guitar") await openQrModal(button.dataset.id);
      if (action === "delete-person") await deletePerson(button.dataset.id);
      if (action === "restore-person") {
        ensureDatabaseConnected();
        await withTimeout(update(ref(db, `people/${button.dataset.id}`), { active: true, updatedAt: Date.now() }));
        toast("人员档案已恢复。", "success");
      }
      if (action === "deactivate-person") {
        ensureDatabaseConnected();
        await withTimeout(update(ref(db, `people/${button.dataset.id}`), { active: false, updatedAt: Date.now() }));
        toast("人员已停用。", "success");
        location.hash = "#/people";
      }
    } catch (error) {
      console.error(error);
      toast(error?.message || "操作失败，请稍后重试。", "error");
    }
  });

  document.addEventListener("submit", async (event) => {
    if (!(event.target instanceof HTMLFormElement)) return;
    const form = event.target;
    if (!["person-form", "guitar-form", "maintenance-form"].includes(form.id)) return;
    event.preventDefault();
    setAppLoading(true, "正在保存…");
    try {
      if (form.id === "person-form") {
        const personId = form.dataset.id || null;
        await savePerson(form, personId);
        closeModal(); toast("人员已保存。", "success"); renderRoute();
      }
      if (form.id === "guitar-form") {
        await saveGuitar(form, form.dataset.id || null);
        const target = form.dataset.personId || form.personId.value;
        closeModal(); toast("吉他档案已保存。", "success"); location.hash = `#/person/${target}`;
      }
      if (form.id === "maintenance-form") {
        const guitarId = form.guitarId.value;
        await saveMaintenance(form, form.dataset.id || null);
        closeModal(); toast("保养记录已保存。", "success"); location.hash = `#/guitar/${guitarId}`;
      }
    } catch (error) {
      toast(error?.message || "保存失败。", "error");
    } finally { setAppLoading(false); }
  });

  document.addEventListener("input", (event) => {
    if (event.target.id === "people-search") { state.personSearch = event.target.value; renderRoute(); requestAnimationFrame(() => { const el = $("#people-search"); el?.focus(); el?.setSelectionRange(el.value.length, el.value.length); }); }
    if (event.target.id === "guitars-search") { state.guitarSearch = event.target.value; renderRoute(); requestAnimationFrame(() => { const el = $("#guitars-search"); el?.focus(); el?.setSelectionRange(el.value.length, el.value.length); }); }
  });

  document.addEventListener("change", async (event) => {
    if (event.target.id === "import-json-input" && event.target.files?.[0]) {
      try { await importJSON(event.target.files[0]); } catch (error) { toast(error?.message || "导入失败。", "error"); }
      event.target.value = "";
    }
  });
}

function stopDatabaseListener() {
  if (state.dbLoadingTimer) {
    clearTimeout(state.dbLoadingTimer);
    state.dbLoadingTimer = null;
  }
  state.dbUnsubs.forEach((unsubscribe) => {
    try { unsubscribe(); } catch {}
  });
  state.dbUnsubs = [];
}

function startDatabaseListener() {
  stopDatabaseListener();
  state.ready = false;
  renderRoute();

  state.dbLoadingTimer = window.setTimeout(() => {
    if (state.ready) return;
    setConnection(false);
    routeError(databaseDiagnosticMessage(), { html: true });
  }, 10000);

  const stopRoot = onValue(rootRef, (snapshot) => {
    if (state.dbLoadingTimer) {
      clearTimeout(state.dbLoadingTimer);
      state.dbLoadingTimer = null;
    }
    state.data = snapshot.val() || {};
    state.data.people ||= {};
    state.data.guitars ||= {};
    state.data.maintenanceRecords ||= {};
    state.data.meta ||= {};
    state.ready = true;
    renderRoute();
  }, (error) => {
    if (state.dbLoadingTimer) {
      clearTimeout(state.dbLoadingTimer);
      state.dbLoadingTimer = null;
    }
    state.ready = false;
    setConnection(false);
    const code = error?.code ? `（${error.code}）` : "";
    routeError(`无法读取 Firebase 数据库 ${code}：${esc(error?.message || "未知错误")}<br><br>请检查 Realtime Database Rules，以及当前网络是否能够连接 Firebase。` , { html: true });
  });
  const stopConnection = onValue(ref(db, ".info/connected"), (snap) => setConnection(Boolean(snap.val())));
  state.dbUnsubs = [stopRoot, stopConnection];
}
onAuthStateChanged(auth, (user) => {
  state.user = user;
  const loginView = $("#login-view");
  const appView = $("#app-view");
  if (user) {
    loginView.hidden = true;
    appView.hidden = false;
    hydrateAccount(user);
    if (!state.ready) startDatabaseListener();
    if (!location.hash) location.hash = "#/dashboard";
    renderRoute();
  } else {
    stopDatabaseListener();
    loginView.hidden = false;
    appView.hidden = true;
    state.ready = false;
    hydrateAccount(null);
  }
});

window.addEventListener("hashchange", renderRoute);
bindStaticEvents();
setConnection(false);

    </script>
  </body>
</html>
